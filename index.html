/* Layout: una sola columna, cartel por pantalla. Cabecera crema fija con los dos logos (PMA a la izquierda) y las tres mariposas-llave.
   Línea gráfica tomada del póster oficial de los 16 días: crema, coral, verde bosque, azul y lavanda. */
:root{
 --bg:#FDEBE3;--surface:#FFFFFF;--ink:#1E2430;--sub:#5B6470;
 --coral:#E5532D;--coral-ink:#C23E1B;--green:#2F4F3E;--blue:#3C6FA8;--lav:#E3DCEE;--lav-ink:#3B3470;--peach:#FBCFBA;--peach-ink:#4A1D0E;
 --line:#F0C4B2;--paper:#FDEBE3;--paper-ink:#1E2430;--ok:#1D7A4D;--okbg:#E3F3EA;--bad:#9C2B1E;--badbg:#FBE4DF;
 --head:"Barlow Condensed","Arial Narrow","Roboto Condensed",sans-serif;
 --body:"Open Sans",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
}
@media(prefers-color-scheme:dark){:root:not([data-theme="light"]){
 --bg:#15211B;--surface:#1F2E26;--ink:#F7EDE6;--sub:#B9C4BC;
 --coral:#FF7A55;--coral-ink:#FF9172;--green:#9ED3B2;--blue:#8DBBEE;--lav:#2B2940;--lav-ink:#CFC8F0;--peach:#3A2B24;--peach-ink:#FFD9C9;
 --line:#34483C;--ok:#7FDCA9;--okbg:#17352A;--bad:#FFA797;--badbg:#3C201C;color-scheme:dark}}
:root[data-theme="dark"]{
 --bg:#15211B;--surface:#1F2E26;--ink:#F7EDE6;--sub:#B9C4BC;
 --coral:#FF7A55;--coral-ink:#FF9172;--green:#9ED3B2;--blue:#8DBBEE;--lav:#2B2940;--lav-ink:#CFC8F0;--peach:#3A2B24;--peach-ink:#FFD9C9;
 --line:#34483C;--ok:#7FDCA9;--okbg:#17352A;--bad:#FFA797;--badbg:#3C201C;color-scheme:dark}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{margin:0;background:var(--bg);color:var(--ink);font:400 17px/1.55 var(--body);padding-inline:max(16px,env(safe-area-inset-left,0px)) max(16px,env(safe-area-inset-right,0px));padding-block:0 56px}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);background:var(--paper);z-index:20}
.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:10;margin-inline:calc(-1*max(16px,env(safe-area-inset-left,0px))) calc(-1*max(16px,env(safe-area-inset-right,0px)));background:var(--paper);border-bottom:3px solid var(--coral)}
.top-in{max-width:760px;margin:0 auto;display:flex;align-items:center;gap:14px;flex-wrap:wrap;padding:10px max(16px,env(safe-area-inset-right,0px)) 10px max(16px,env(safe-area-inset-left,0px))}
.logos{display:flex;align-items:center;gap:14px;min-width:0}
.logos img{display:block;height:auto}
.pma{width:42px;border-radius:3px}.l16{width:min(210px,44vw)}
.keys{margin-left:auto;display:flex;gap:8px}
.key{display:flex;flex-direction:column;align-items:center;gap:1px;width:58px;font:700 11px/1 var(--head);letter-spacing:.08em;text-transform:uppercase;color:#7D7570}
.key svg{width:38px;height:34px;color:#CFC3BB;--in:#FDEBE3;--bod:#CFC3BB}
.key.on{color:var(--coral-ink);color:#B53C1B}
.key.on svg{color:#E5532D;--in:#FFF6F0;--bod:#2F4F3E;animation:flap .9s ease-out both}
main{max-width:760px;margin:0 auto;padding-top:26px;display:block}
.step{animation:in .4s ease both}
.eyebrow{display:inline-block;font:700 15px/1 var(--head);letter-spacing:.1em;text-transform:uppercase;background:var(--coral);color:#fff;border-radius:999px;padding:7px 16px 6px;margin:0 0 14px}
h1,h2{font-family:var(--head);font-weight:800;text-transform:none;letter-spacing:-.005em;line-height:.98;color:var(--coral-ink);margin:0 0 14px;text-wrap:balance}
h1{font-size:clamp(3rem,11vw,5.2rem)}h2{font-size:clamp(2.4rem,8.5vw,3.6rem)}
h3{font:700 1.5rem/1.1 var(--head);letter-spacing:.04em;text-transform:uppercase;color:var(--green);margin:0 0 8px}
p{margin:0 0 .8em;max-width:62ch}
.lead{font-size:1.12rem}
.hero{display:grid;grid-template-columns:minmax(0,1fr) 210px;gap:20px;align-items:center}
.hero img,.tile{display:block;width:100%;height:auto;border-radius:20px;box-shadow:0 6px 18px rgba(30,36,48,.12)}
.band{margin:18px 0;background:var(--green);color:#fff;border-radius:16px;padding:14px 18px;text-align:center;font:800 clamp(1.5rem,6vw,2.2rem)/1 var(--head);letter-spacing:.01em}
.band b{color:#FF9B7E;font-weight:800}
@media(prefers-color-scheme:dark){:root:not([data-theme="light"]) .band{background:#0E1813;color:#F7EDE6}}
:root[data-theme="dark"] .band{background:#0E1813;color:#F7EDE6}
.panel{background:var(--lav);color:var(--ink);border-radius:18px;padding:16px 20px;margin:14px 0}
.panel .lab{display:block;font:700 15px/1 var(--head);letter-spacing:.1em;text-transform:uppercase;color:var(--lav-ink);margin-bottom:6px}
.quote{font-size:1.1rem}
.choices{background:var(--surface);border-radius:18px;border-left:6px solid var(--coral);padding:8px 10px;margin:14px 0;box-shadow:0 2px 10px rgba(30,36,48,.06)}
.opt{display:flex;gap:12px;align-items:flex-start;width:100%;text-align:left;font:400 1rem/1.45 var(--body);color:var(--ink);background:transparent;border:2px solid transparent;border-radius:12px;padding:11px 12px;cursor:pointer;box-shadow:none;transform:none}
.opt+.opt{border-top:1px solid var(--line)}
.opt .box{flex:none;width:24px;height:24px;border-radius:7px;border:2.5px solid var(--coral);margin-top:1px;display:grid;place-items:center;color:#fff}
.opt .box svg{width:15px;height:15px;opacity:0}
.opt:hover{border-color:var(--coral);background:transparent;transform:none;box-shadow:none}
.opt.sel{background:var(--peach);color:var(--peach-ink);border-color:var(--coral);animation:wig .3s}
.opt.sel .box{background:var(--coral)}.opt.sel .box svg{opacity:1}
.item{background:var(--surface);border-radius:16px;padding:14px 16px;margin:10px 0;box-shadow:0 2px 10px rgba(30,36,48,.06)}
.item .q{font-weight:600}
.pick{display:flex;gap:8px;margin-top:10px;flex-wrap:wrap}
.pick button,.pick label{flex:1 1 120px}
.chip{font:700 1.05rem/1 var(--head);letter-spacing:.06em;text-transform:uppercase;text-align:center;border:2px solid var(--line);border-radius:999px;padding:10px 14px 9px;cursor:pointer;background:transparent;color:var(--ink)}
.chip:hover{border-color:var(--coral)}
.chip[aria-pressed="true"]{background:var(--green);color:#fff;border-color:var(--green)}
@media(prefers-color-scheme:dark){:root:not([data-theme="light"]) .chip[aria-pressed="true"]{background:var(--green);color:#10201A}}
:root[data-theme="dark"] .chip[aria-pressed="true"]{background:var(--green);color:#10201A}
select{width:100%;font:inherit;color:var(--ink);background:var(--bg);border:2px solid var(--line);border-radius:12px;padding:11px 12px;margin-top:10px}
input[type=text]{width:100%;font:inherit;color:var(--ink);background:var(--surface);border:2px solid var(--line);border-radius:12px;padding:12px 14px}
label.f{display:block;font-weight:600;margin:14px 0 6px}
button{font:700 1.15rem/1 var(--head);letter-spacing:.06em;text-transform:uppercase;cursor:pointer;border:0;border-radius:999px;padding:14px 26px 13px;background:var(--coral);color:#fff;transition:transform .15s,box-shadow .15s}
button:hover{transform:translateY(-2px);box-shadow:0 8px 16px rgba(229,83,45,.3)}
@media(prefers-color-scheme:dark){:root:not([data-theme="light"]) button:not(.ghost):not(.opt):not(.chip){color:#2A1109}}
:root[data-theme="dark"] button:not(.ghost):not(.opt):not(.chip){color:#2A1109}
button.ghost{background:transparent;color:var(--ink);border:2px solid var(--line);box-shadow:none}
button.ghost:hover{border-color:var(--coral);box-shadow:none}
button.sm{padding:10px 18px 9px;font-size:1rem}
:focus-visible{outline:3px solid var(--blue);outline-offset:3px}
.row{display:flex;gap:10px;flex-wrap:wrap;margin-top:18px}
.msg{padding:12px 16px;border-radius:14px;margin:14px 0;font-weight:600}
.msg.hint{background:var(--lav);color:var(--lav-ink)}.msg.ok{background:var(--okbg);color:var(--ok)}.msg.bad{background:var(--badbg);color:var(--bad)}
.aviso{background:var(--peach);color:var(--peach-ink);border-radius:14px;padding:12px 16px;margin:16px 0;font-size:.95rem}
.clave{display:flex;gap:14px;align-items:flex-start;background:var(--peach);color:var(--peach-ink);border-radius:18px;padding:16px 18px;margin:16px 0}
.clave .lab{display:block;font:800 15px/1 var(--head);letter-spacing:.1em;text-transform:uppercase;margin-bottom:5px}
.clave p{margin:0;font-weight:700;font-size:1.08rem}
.clave svg{flex:none;width:30px;height:30px;color:var(--coral-ink)}
details{background:var(--surface);border-radius:14px;padding:10px 16px;margin:12px 0}
summary{cursor:pointer;font-weight:700}
details ul{margin:8px 0 4px;padding-left:20px}
/* mariposa-mensaje */
.bfly{position:relative;background:var(--surface);border:3px dashed var(--coral);border-radius:34px;padding:22px 22px 18px;margin:16px 0;text-align:center;animation:pop .6s cubic-bezier(.2,1.3,.4,1) both}
.bfly .big{display:block;width:92px;height:82px;margin:-52px auto 6px;color:#E5532D;--in:#FFF6F0;--bod:#2F4F3E;filter:drop-shadow(0 4px 6px rgba(30,36,48,.18));animation:flutter 2.6s ease-in-out infinite;transform-origin:center bottom}
.bfly .word{font:800 clamp(2.2rem,9vw,3.2rem)/1 var(--head);letter-spacing:.02em;color:var(--coral-ink);text-transform:uppercase}
.bfly .msgtxt{font:700 clamp(1.5rem,6vw,2.1rem)/1.08 var(--head);color:var(--green);margin:8px auto 10px;max-width:24ch;text-wrap:balance}
.bfly .foot{font:700 13px/1.3 var(--head);letter-spacing:.14em;text-transform:uppercase;color:var(--sub)}
.bfly.plain .big{margin-top:-52px}
.cf{position:fixed;bottom:-60px;width:34px;height:30px;pointer-events:none;z-index:30;color:#E5532D;--in:#FFF6F0;--bod:#2F4F3E;animation:rise linear forwards}
.small{font-size:.9rem;color:var(--sub)}
.lema{font:700 1.5rem/1.1 var(--head);letter-spacing:.03em;color:var(--green);margin:0 0 14px}
.checks label{display:flex;gap:12px;align-items:flex-start;padding:10px 4px;cursor:pointer;font-weight:600}
.checks input{width:22px;height:22px;margin-top:3px;accent-color:var(--coral);flex:none}
.orange{display:flex;align-items:center;gap:14px;background:var(--green);color:#fff;border-radius:20px;padding:14px 18px;margin:16px 0}
.orange svg{flex:none;width:62px;height:62px}
.orange p{margin:0;font:800 1.7rem/1 var(--head)}.orange small{display:block;font:600 .9rem/1.3 var(--body);opacity:.9;margin-top:4px}
@media(prefers-color-scheme:dark){:root:not([data-theme="light"]) .orange{background:#0E1813}}
:root[data-theme="dark"] .orange{background:#0E1813}
.const{background:var(--surface);border:3px solid var(--green);border-radius:20px;padding:16px 20px;margin:16px 0;font-size:1.05rem}
.const b{font:800 1.6rem/1.1 var(--head);color:var(--green);letter-spacing:.02em;text-transform:uppercase;display:block;margin-bottom:4px}
.ft{margin-top:38px;padding-top:14px;border-top:2px solid var(--line);display:flex;gap:12px;flex-wrap:wrap;justify-content:space-between;font-size:.88rem;color:var(--sub)}
dialog{max-width:520px;width:calc(100% - 32px);border:0;border-radius:22px;background:var(--bg);color:var(--ink);padding:22px}
dialog::backdrop{background:rgba(20,10,10,.6)}
@keyframes in{from{opacity:0;transform:translateY(12px)}to{opacity:1;transform:none}}
@keyframes pop{0%{transform:scale(.8);opacity:0}100%{transform:scale(1);opacity:1}}
@keyframes wig{30%{transform:rotate(-.6deg)}60%{transform:rotate(.6deg)}}
@keyframes flap{0%{transform:scale(.4) rotate(-14deg)}60%{transform:scale(1.25) rotate(6deg)}100%{transform:none}}
@keyframes flutter{0%,100%{transform:translateY(0) rotate(-2deg)}50%{transform:translateY(-6px) rotate(2deg)}}
@keyframes rise{to{transform:translate(var(--dx),-115vh) rotate(var(--rot))}}
@media(max-width:560px){.hero{grid-template-columns:1fr}.hero img{max-width:230px}.keys{gap:4px;margin-left:0;width:100%;justify-content:space-between}.key{width:auto;flex:1}.l16{width:min(190px,50vw)}}
@media(prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>

 for(var k=0;k<os.length;k++)os[k].onclick=function(){var s=this.classList.toggle("sel");this.setAttribute("aria-pressed",s)};
 hint("Los primeros 60 segundos no son para resolver el problema. Son para que la persona sienta que puede hablar y para saber si hay peligro ahora.");wirePause();
 document.getElementById("chk").onclick=function(){
  var sel=[].map.call(document.querySelectorAll(".opt"),function(b){return b.classList.contains("sel")});
  var miss=R1.filter(function(x,i){return x.ok&&!sel[i]}).length,over=R1.filter(function(x,i){return !x.ok&&sel[i]}).length;
  if(miss||over){document.getElementById("fb").innerHTML='<div class="msg bad">'+(miss?"Te faltan "+miss+" acción(es) correcta(s). ":"")+(over?"Marcaste "+over+" que no ayudan en este momento.":"")+'</div>';return}
  win(0,"Tu primera tarea no es resolver el problema. Es crear seguridad.",["Pausa y atención total: la persona nota si de verdad la escuchas.","Privacidad: protege su seguridad y su dignidad.","Presentarte y explicar tu rol: es honesto sobre lo que puedes y no puedes hacer.","Verificar riesgos o necesidades urgentes: lo primero es que esté a salvo.","No le prometas que nadie lo sabrá: si hay obligación de reportar, tienes que decírselo con claridad."],MARIPOSAS[23],r2)
 };
}
function r2(){
 $(head(2,IMG.disab,"Ilustración de una mujer con discapacidad acompañada","Escuchar no es investigar")
 +'<div class="panel"><span class="lab">Situación</span><p class="quote" style="margin:0">Una mujer con discapacidad empieza a contarte que es sobreviviente de violencia en su hogar, y sientes la necesidad de entender exactamente qué pasó.</p></div>'
 +'<p>Clasifica cada frase: ¿la <strong>evitas</strong> o la <strong>practicas</strong>?</p>'
 +R2.map(function(x,i){return '<div class="item"><div class="q">'+esc(x.t)+'</div><div class="pick" data-i="'+i+'"><button class="chip" aria-pressed="false" data-v="Evita">Evita</button><button class="chip" aria-pressed="false" data-v="Practica">Practica</button></div></div>'}).join("")
 +'<div id="hb"></div><div id="fb"></div><div class="row"><button id="chk">Comprobar</button><button class="ghost" id="h">Pedir pista</button>'+pb+'</div></div>');
 var ps=document.querySelectorAll(".pick");
 [].forEach.call(ps,function(p){[].forEach.call(p.querySelectorAll(".chip"),function(c){c.onclick=function(){[].forEach.call(p.querySelectorAll(".chip"),function(o){o.setAttribute("aria-pressed","false")});c.setAttribute("aria-pressed","true")}})});
 hint("Pregúntate: ¿esta frase pide detalles, duda de ella o decide por ella? Entonces se evita.");wirePause();
 document.getElementById("chk").onclick=function(){
  var bad=0,empty=0;
  [].forEach.call(ps,function(p,i){var on=p.querySelector('[aria-pressed="true"]');if(!on)empty++;else if(on.getAttribute("data-v")!==R2[i].a)bad++});
  if(empty||bad){document.getElementById("fb").innerHTML='<div class="msg bad">'+(empty?"Faltan "+empty+" por elegir. ":"")+(bad?bad+" sin acertar. Piensa en cómo se sentiría la persona al oírla.":"")+'</div>';return}
  win(1,"No necesitas conocer toda la historia para ofrecer información sobre apoyo.",R2.map(function(x){return x.t+" "+x.a+": "+x.w}),MARIPOSAS[9],r3)
 };
}
function r3(){
 $(head(3,IMG.caminos,"Ilustración de varios caminos que se cruzan","La respuesta correcta no siempre es la misma, pero la ruta sí")
 +'<div class="panel"><span class="lab">Situación</span><p class="quote" style="margin:0">Al cierre de una distribución, una madre te cuenta en privado que un monitor de un socio le pidió favores sexuales para mantenerla en la lista de asistencia. Dice que también abordó a su hija de 15 años y que ella sufre violencia en su casa desde hace tiempo. Tiene miedo.</p></div>'
 +'<p><strong>Un caso, cuatro caminos que corren en paralelo.</strong> ¿A qué camino corresponde cada paso?</p>'
 +R3.map(function(x,i){return '<div class="item"><div class="q">'+esc(x.t)+'</div><select id="p'+i+'" aria-label="Camino del paso '+(i+1)+'"><option value="">Elige un camino</option>'+PATHS.map(function(p){return "<option>"+p+"</option>"}).join("")+'</select></div>'}).join("")
 +'<div id="hb"></div><div id="fb"></div><div class="row"><button id="chk">Comprobar</button><button class="ghost" id="h">Pedir pista</button>'+pb+'</div></div>');
 hint("Fíjate en la palabra clave de cada paso: reportar, mejorar el programa con consentimiento, apoyo que ella decide, o lenguaje apropiado y persona adulta segura.");wirePause();
 document.getElementById("chk").onclick=function(){
  var bad=R3.filter(function(x,i){return document.getElementById("p"+i).value!==x.a}).length;
  if(bad){document.getElementById("fb").innerHTML='<div class="msg bad">'+bad+' sin acertar. Cada paso corresponde a un camino distinto.</div>';return}
  win(2,"Un mismo caso activa varias rutas a la vez y ninguna reemplaza a otra. Tu obligación de reportar EAS y de proteger ante riesgo de daño no depende de que la persona lo pida.",R3.map(function(x){return x.w}),MARIPOSAS[2],end)
 };
}
function win(i,clave,details,msg,next){
 st.keys[i]=true;keys();
 $('<div class="step"><span class="eyebrow">Reto '+(i+1)+' superado</span>'
 +'<div class="bfly">'+bf("big")+'<div class="word">'+WORDS[i]+'</div><div class="msgtxt">'+esc(msg)+'</div><div class="foot">escucha.protege.conecta · 16 días de activismo</div></div>'
 +'<div class="clave"><svg aria-hidden="true"><use href="#bulb"/></svg><div><span class="lab">Clave</span><p>'+esc(clave)+'</p></div></div>'
 +(details.length?'<details><summary>Por qué (lectura rápida)</summary>'+list(details)+'</details>':"")
 +'<div class="row"><button id="nx">Continuar</button></div></div>');
 document.getElementById("nx").onclick=next;confetti(9);
}
function otra(){
 var pool=MARIPOSAS.map(function(m,i){return i}).filter(function(i){return !st.used[i]});
 if(!pool.length){st.used={};pool=MARIPOSAS.map(function(m,i){return i})}
 var i=pool[Math.floor(Math.random()*pool.length)];st.used[i]=1;
 document.getElementById("wall").innerHTML='<div class="bfly" style="margin-top:44px">'+bf("big")+'<div class="msgtxt">'+esc(MARIPOSAS[i])+'</div><div class="foot">Mariposa '+(i+1)+' de '+MARIPOSAS.length+'</div></div>';
}
function end(){
 var d=new Date().toLocaleDateString("es",{day:"numeric",month:"long",year:"numeric"});
 $('<div class="step"><div class="hero"><div><span class="eyebrow">Ruta completa</span><h2>Del hambre a la justicia</h2><p class="lema">Escucha. Protege. Conecta.</p></div><img src="'+IMG.pair+'" alt="Ilustración de dos mujeres abrazadas"></div>'
 +'<div class="const"><b>Constancia</b>'+esc(st.name||"Participante")+' completó Reto25N el '+d+'.</div>'

 +'<p class="small">Este reto no guarda ni envía datos. Si quieres compartir tu constancia, toma una captura de pantalla.</p>'
 +'<div class="row"><button class="ghost" id="again">Volver a empezar</button></div>'
 +'<div class="ft"><span>Género, Protección e Inclusión (GPI)</span><span>16 días de activismo · 25 nov a 10 dic</span></div></div>');
 document.getElementById("more").onclick=otra;document.getElementById("again").onclick=function(){st.keys=[false,false,false];st.used={};keys();intro()};
 otra();confetti(26);
}
keys();intro();
